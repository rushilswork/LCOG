[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-onboard"
version = "0.1.0"
description = "Generate structured onboarding guides for legacy codebases"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",
    "click>=8.1",
    "gitpython>=3.1",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.22",
    "tree-sitter-javascript>=0.22",
    "tree-sitter-typescript>=0.22",
    "tree-sitter-cpp>=0.22",
    "tree-sitter-java>=0.22",
    "networkx>=3.2",
    "rich>=13.0",
    "jinja2>=3.1",
    "mkdocs>=1.5,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "pymdown-extensions>=10.0",
    "pyyaml>=6.0",
]

[project.scripts]
onboard = "onboard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["onboard*"]
